[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nhl-propsbot"
version = "1.0.0"
description = "NHL shots-on-goal player props bot: projections, odds comparison and staking"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
propsbot = "propsbot.cli:main"

[tool.setuptools.packages.find]
include = ["propsbot*"]

[tool.setuptools.package-data]
propsbot = ["*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
