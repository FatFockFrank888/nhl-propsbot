name: NHL props bot (flyttad)

# NHL-boten körs nu i den sammanslagna boten: FatFockFrank888/propsbot (arbetsflödet bevaka-odds).
# Det här arbetsflödet skannar inte längre. Det publicerar bara en sida som skickar vidare dit.
on:
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  redirect:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: redirect
      - uses: actions/deploy-pages@v4
